name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      - name: Install package and development tools
        run: uv sync --locked --no-editable

      - name: Lint
        run: uv run --locked --no-editable ruff check .

      - name: Check formatting
        run: uv run --locked --no-editable ruff format --check .

      - name: Test installed package
        env:
          UV_OFFLINE: "1"
          MLFLOW_DISABLE_TELEMETRY: "true"
        run: uv run --locked --no-editable pytest

      - name: Build distributions
        run: uv build

  compose-e2e:
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install
      - run: uv sync --locked --no-editable
      - name: Train, register, predict, interrupt backend and restart Compose
        run: uv run --locked --no-editable python scripts/compose_smoke.py --report "${RUNNER_TEMP}/modelops-e2e.json"
      - name: Preserve informational timings and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modelops-e2e
          path: ${{ runner.temp }}/modelops-e2e.json
          if-no-files-found: warn
          retention-days: 14
