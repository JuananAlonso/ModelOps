name: modelops
x-app: &app
  image: modelops-local:mop005
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  environment: &client-env
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MLFLOW_EXPERIMENT_NAME: modelops-compose
    MLFLOW_DISABLE_TELEMETRY: "true"
    MLFLOW_DISABLE_AGENT_HINT: "1"
    MLFLOW_HTTP_REQUEST_TIMEOUT: "10"
    MLFLOW_HTTP_REQUEST_MAX_RETRIES: "2"
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: modelops
      POSTGRES_DB: mlflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modelops_local_demo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U modelops -d mlflow']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  mlflow:
    <<: *app
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://modelops:${POSTGRES_PASSWORD:-modelops_local_demo}@postgres:5432/mlflow
      MLFLOW_DISABLE_TELEMETRY: "true"
      MLFLOW_DISABLE_AGENT_HINT: "1"
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    command: [mlflow, server, --host, 0.0.0.0, --port, "5000", --workers, "1", --serve-artifacts, --artifacts-destination, /data/artifacts, --default-artifact-root, "mlflow-artifacts:/", --allowed-hosts, "mlflow:5000,localhost:*,127.0.0.1:*"]
    ports:
      - "127.0.0.1:${MODELOPS_MLFLOW_PORT:-5001}:5000"
    volumes:
      - mlflow-artifacts:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    restart: unless-stopped
  api:
    <<: *app
    build: .
    environment:
      <<: *client-env
      MODELOPS_MODEL_NAME: ${MODELOPS_MODEL_NAME:-modelops-baseline}
      MODELOPS_MODEL_VERSION: ${MODELOPS_MODEL_VERSION:-1}
    ports:
      - "127.0.0.1:${MODELOPS_API_PORT:-8001}:8000"
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 20s
  train:
    <<: *app
    profiles: [tools]
    command: [modelops-train-mlflow, --seed, "42", --output-dir, /tmp/training]
    depends_on:
      mlflow:
        condition: service_healthy
volumes:
  postgres-data:
  mlflow-artifacts:
