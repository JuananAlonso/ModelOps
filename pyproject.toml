[build-system]
requires = ["uv_build==0.13.0"]
build-backend = "uv_build"

[project]
name = "modelops"
version = "0.1.0"
description = "Base modular para una plataforma MLOps."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.14,<1",
]

[tool.uv]
required-version = "==0.13.0"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
